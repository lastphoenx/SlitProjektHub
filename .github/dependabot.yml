version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # sqlmodel 0.0.47: SQLAlchemy<2.1.0 — keine Bot-PRs (semver-minor reichte nicht, siehe PR #9/#10)
      - dependency-name: "SQLAlchemy"
