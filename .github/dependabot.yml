version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # sqlmodel caps SQLAlchemy at <2.1; 2.0.x → 2.1.x is semver-minor for Dependabot
      - dependency-name: "SQLAlchemy"
        update-types: ["version-update:semver-minor"]
