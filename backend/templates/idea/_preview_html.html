<div class="modal-backdrop">
  <div class="modal" style="max-width:min(96vw,1200px);width:min(96vw,1200px);max-height:92vh;display:flex;flex-direction:column" role="dialog">
    <div class="modal-header" style="flex-shrink:0">
      <div>
        <h2 class="modal-title" style="font-size:.95rem">HTML-Bericht — {{ idea.ai_project_name or idea.title or 'Idee' }}</h2>
        <p class="text-muted" style="font-size:.72rem">Interaktive Vorschau · Inhaltsverzeichnis im Bericht</p>
      </div>
      <div style="display:flex;gap:.35rem;flex-wrap:wrap">
        <a class="btn btn-secondary btn-sm" href="/idea/report/{{ idea.id }}" target="_blank" rel="noopener">Vollansicht</a>
        <a class="btn btn-secondary btn-sm" href="/idea/report/{{ idea.id }}?disposition=attachment">HTML Download</a>
        {% if idea.deck_path %}
        <a class="btn btn-secondary btn-sm" href="/idea/deck/{{ idea.id }}">PPTX</a>
        {% endif %}
        <button class="btn btn-ghost btn-icon" onclick="document.getElementById('modal-slot').innerHTML=''">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div style="flex:1;min-height:0;overflow:hidden;padding:.35rem">
      <iframe src="/idea/report/{{ idea.id }}" title="HTML-Bericht"
              style="width:100%;height:min(75vh,800px);border:1px solid var(--color-border);border-radius:.375rem;background:#fff"></iframe>
    </div>
  </div>
</div>
