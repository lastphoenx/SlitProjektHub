{# Optional: eigene Cloud-KI nur für Visualisierung (Prompt/Folienstruktur) #}
<div style="padding:.5rem .6rem;border:1px dashed var(--color-border);border-radius:.375rem;background:var(--color-surface-2)">
  <label class="form-label" style="font-size:.72rem;margin-bottom:.35rem">KI für Visualisierung (optional)</label>
  <p class="text-muted" style="font-size:.68rem;margin:0 0 .45rem">
    Getrennt von der KI-Vorbewertung. Nur Cloud-Provider (OpenAI / Anthropic). Bilder (PNG) werden weiterhin über OpenAI Images erzeugt.
  </p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
    <div>
      <label class="form-label" style="font-size:.68rem">Provider</label>
      <select class="form-select visual-llm-provider" name="visual_llm_provider" data-form="{{ form_id or 'default' }}">
        <option value="" {% if not form_visual_provider %}selected{% endif %}>— wie KI-Einstellungen —</option>
        {% for p in visual_llm_providers %}
        <option value="{{ p }}" {% if form_visual_provider == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label" style="font-size:.68rem">Modell</label>
      <select class="form-select visual-llm-model" name="visual_llm_model" id="visual-llm-model-{{ form_id or 'default' }}">
        <option value="">— Standard —</option>
        {% for p, models in visual_llm_models.items() %}
        {% for m in models %}
        <option value="{{ m }}" data-provider="{{ p }}" {% if form_visual_provider == p and form_visual_model == m %}selected{% endif %}>{{ p }}: {{ m }}</option>
        {% endfor %}
        {% endfor %}
      </select>
    </div>
  </div>
</div>
<script>
(function() {
  const modelsJson = {{ visual_llm_models | tojson }};
  document.querySelectorAll('.visual-llm-provider').forEach(sel => {
    const formId = sel.dataset.form || 'default';
    const modelSel = document.getElementById('visual-llm-model-' + formId);
    if (!modelSel) return;
    function syncModels() {
      const p = sel.value;
      modelSel.querySelectorAll('option[data-provider]').forEach(o => {
        o.hidden = p && o.dataset.provider !== p;
      });
      if (p && modelSel.value) {
        const cur = modelSel.querySelector('option[value="' + modelSel.value + '"]');
        if (cur && cur.hidden) modelSel.value = '';
      }
    }
    sel.addEventListener('change', syncModels);
    syncModels();
  });
})();
</script>
