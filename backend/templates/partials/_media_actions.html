{# Vorschau / Vollansicht / Download — wie Dokumenten-Tabelle #}
<div class="flex items-center gap-1">
  {% if preview_hx_get %}
  <button
    type="button"
    class="btn btn-ghost btn-sm btn-icon"
    title="Vorschau"
    hx-get="{{ preview_hx_get }}"
    hx-target="#modal-slot"
    hx-swap="innerHTML"
  >
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </svg>
  </button>
  {% endif %}
  {% if inline_url %}
  <a class="btn btn-ghost btn-sm btn-icon" title="Vollansicht (neuer Tab)" href="{{ inline_url }}" target="_blank" rel="noopener">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </a>
  {% endif %}
  {% if download_url %}
  <a class="btn btn-ghost btn-sm btn-icon" title="Download" href="{{ download_url }}" download>
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
  </a>
  {% endif %}
</div>
