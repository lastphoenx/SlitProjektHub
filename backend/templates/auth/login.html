<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Login – SlitProjektHub{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f1117; }
    .auth-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; }
    .auth-card h1 { font-size: 1.4rem; color: #e2e8f0; margin-bottom: 0.25rem; }
    .auth-card .subtitle { color: #718096; font-size: 0.875rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; color: #a0aec0; font-size: 0.85rem; margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.6rem 0.75rem; background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; font-size: 0.95rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .btn-primary { width: 100%; padding: 0.65rem; background: #667eea; color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; }
    .btn-primary:hover { background: #5a67d8; }
    .error-box { background: #742a2a; border: 1px solid #fc8181; border-radius: 6px; padding: 0.75rem; color: #fed7d7; font-size: 0.875rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>🔐 SlitProjektHub</h1>
    <p class="subtitle">Bitte einloggen</p>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/login">
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary">Einloggen</button>
    </form>
  </div>
</body>
</html>
