<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login-Benutzer – SlitProjektHub</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #e2e8f0; background: #0f1117; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid #2d3148; }
    select, button { background: #1a1d27; color: #e2e8f0; border: 1px solid #2d3148; padding: 0.35rem 0.5rem; }
    .error-box { background: #742a2a; padding: 0.75rem; margin-bottom: 1rem; }
    a { color: #a3bffa; }
  </style>
</head>
<body>
  <h1>Login-Benutzer</h1>
  <p>App-Rollen (Vergabe), nicht Stammdaten-Personas. Ohne Rolle: Login und Phase A/B ja, Bewertung (Phase C) nein.</p>
  <p><a href="/dashboard">Zurück</a></p>
  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}
  <table>
    <thead>
      <tr><th>User</th><th>App-Rolle</th><th>Setzen</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.app_role_key or "unassigned" }}</td>
        <td>
          <form method="post" action="/admin/users/{{ u.username }}/role" style="display:flex;gap:0.5rem">
            <select name="app_role_key">
              <option value="">(unassigned)</option>
              {% for r in roles %}
              <option value="{{ r.key }}" {% if u.app_role_key == r.key %}selected{% endif %}>{{ r.title }}</option>
              {% endfor %}
            </select>
            <button type="submit">Speichern</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
